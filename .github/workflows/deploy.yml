name: Deploy to Netlify

on:
  push:
    branches:
      - master  # Cambia 'main' por tu rama principal si es diferente

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajusta la versión según tu proyecto

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # Este comando debe generar tu carpeta de compilación (dist, build, etc.)

      - name: Deploy to Netlify
        uses: jsmrcaga/action-netlify-deploy@v2.0.0
        with:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_TO_PROD: true